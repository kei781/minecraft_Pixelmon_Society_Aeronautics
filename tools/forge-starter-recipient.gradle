// Two disposable probe variants; only the authored mixin goes into production.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def sourceRoot = project.findProperty('psaStarterSource')
    def pixelmonPath = project.findProperty('psaPixelmonJar')
    if (!sourceRoot || !pixelmonPath) throw new GradleException('Explicit probe source and pinned Pixelmon required')
    def pixelmon = new File(pixelmonPath.toString())
    if (!pixelmon.isFile() || java.nio.file.Files.isSymbolicLink(pixelmon.toPath()))
        throw new GradleException('Regular pinned input required')
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    pixelmon.withInputStream { input ->
        byte[] buffer = new byte[65536]; int count
        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    if (digest.digest().encodeHex().toString() != '8f2777f5a7cd2b5fc48ac3f5531d434af4120c7d40adc9929d5a3737c404246a')
        throw new GradleException('Unexpected native binary identity')
    def directory = new File(sourceRoot.toString())
    def compiler = project.tasks.register('compilePsaStarterProbe', JavaCompile) {
        source project.fileTree(directory) { include '**/*.java' }
        source new File(directory, '../../compat/forge-port/PixelmonStarterRecipientMixin.java')
        classpath = project.sourceSets.main.compileClasspath + project.files(pixelmon)
        destinationDirectory.set(project.layout.buildDirectory.dir('psa-starter-probe/classes'))
        options.release.set(17); options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none']
    }
    project.tasks.register('psaStarterBaselineJar', Jar) {
        dependsOn compiler
        archiveFileName.set('psa-starter-probe-0.1-baseline.jar')
        duplicatesStrategy = DuplicatesStrategy.FAIL
        from(compiler.flatMap { it.destinationDirectory }) { exclude 'dev/psa/startercompat/**' }
        from new File(directory, 'resources')
        manifest.attributes('FMLModType': 'MOD')
        preserveFileTimestamps = false; reproducibleFileOrder = true
    }
    project.reobf.create('psaStarterBaselineJar')
    project.tasks.register('psaStarterPatchedJar', Jar) {
        dependsOn compiler
        archiveFileName.set('psa-starter-probe-0.1-patched.jar')
        duplicatesStrategy = DuplicatesStrategy.FAIL
        from compiler.flatMap { it.destinationDirectory }
        from new File(directory, 'resources')
        from new File(directory, '../../compat/forge-port/psa-starter-recipient.mixins.json')
        manifest.attributes('FMLModType': 'MOD', 'MixinConfigs': 'psa-starter-recipient.mixins.json')
        preserveFileTimestamps = false; reproducibleFileOrder = true
    }
    project.reobf.create('psaStarterPatchedJar')
}
