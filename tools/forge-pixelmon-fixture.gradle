// Original native test assertions, real owned world fixtures; excluded from production.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def sourceRoot = project.findProperty('psaPixelmonFixtureSource')
    def pixelmonPath = project.findProperty('psaPixelmonJar')
    if (!sourceRoot || !pixelmonPath) throw new GradleException('Explicit fixture source and pinned Pixelmon jar required')
    def pixelmon = new File(pixelmonPath.toString())
    if (!pixelmon.isFile() || java.nio.file.Files.isSymbolicLink(pixelmon.toPath()))
        throw new GradleException('A regular pinned Pixelmon JAR is required')
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    pixelmon.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    if (digest.digest().encodeHex().toString() != '8f2777f5a7cd2b5fc48ac3f5531d434af4120c7d40adc9929d5a3737c404246a')
        throw new GradleException('Unexpected Pixelmon input identity')
    def directory = new File(sourceRoot.toString())
    def compiler = project.tasks.register('compilePsaPixelmonFixture', JavaCompile) {
        source project.fileTree(directory) { include '**/*.java' }
        source new File(directory, '../../compat/forge-port/PixelmonDynamaxHitpointsMixin.java')
        classpath = project.sourceSets.main.compileClasspath + project.files(pixelmon)
        destinationDirectory.set(project.layout.buildDirectory.dir('psa-pixelmon-fixture/classes'))
        options.release.set(17)
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-proc:none']
    }
    project.tasks.register('psaPixelmonFixtureJar', Jar) {
        dependsOn compiler
        archiveFileName.set('psa-pixelmon-fixture-0.2-baseline.jar')
        duplicatesStrategy = DuplicatesStrategy.FAIL
        from(compiler.flatMap { it.destinationDirectory }) { exclude 'dev/psa/compat/**' }
        from(new File(directory, 'resources')) { exclude 'psa-pixelmon-hp-patch.mixins.json' }
        manifest.attributes('FMLModType': 'MOD', 'MixinConfigs': 'psa-pixelmon-fixture.mixins.json')
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    project.reobf.create('psaPixelmonFixtureJar')
    project.tasks.register('psaPixelmonFixturePatchedJar', Jar) {
        dependsOn compiler
        archiveFileName.set('psa-pixelmon-fixture-0.2-patched.jar')
        duplicatesStrategy = DuplicatesStrategy.FAIL
        from compiler.flatMap { it.destinationDirectory }
        from new File(directory, 'resources')
        manifest.attributes('FMLModType': 'MOD', 'MixinConfigs': 'psa-pixelmon-fixture.mixins.json,psa-pixelmon-hp-patch.mixins.json')
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    project.reobf.create('psaPixelmonFixturePatchedJar')
}
