// Compiles the authored Pixelmon PC resend against the prepared port workspace and the pinned
// Pixelmon JAR; only this class is later added to the common JAR by tools/forge_pcsync_compat.py.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def sourceRoot = project.findProperty('psaPcResyncSource')
    def pixelmonPath = project.findProperty('psaPixelmonJar')
    if (!sourceRoot || !pixelmonPath) throw new GradleException('Explicit authored source directory and pinned Pixelmon required')
    def pixelmon = new File(pixelmonPath.toString())
    if (!pixelmon.isFile() || java.nio.file.Files.isSymbolicLink(pixelmon.toPath()))
        throw new GradleException('Regular pinned input required')
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    pixelmon.withInputStream { input ->
        byte[] buffer = new byte[65536]; int count
        while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
    }
    if (digest.digest().encodeHex().toString() != '8f2777f5a7cd2b5fc48ac3f5531d434af4120c7d40adc9929d5a3737c404246a')
        throw new GradleException('Unexpected native binary identity')
    def directory = new File(sourceRoot.toString())
    def compiler = project.tasks.register('compilePsaPcResync', JavaCompile) {
        source new File(directory, 'PixelmonPcResyncMixin.java')
        classpath = project.sourceSets.main.compileClasspath + project.files(pixelmon)
        destinationDirectory.set(project.layout.buildDirectory.dir('psa-pc-resync/classes'))
        options.release.set(17); options.encoding = 'UTF-8'; options.compilerArgs += ['-proc:none']
    }
    project.tasks.register('psaPcResyncJar', Jar) {
        dependsOn compiler
        archiveFileName.set('psa-pc-resync-0.1.jar')
        duplicatesStrategy = DuplicatesStrategy.FAIL
        from compiler.flatMap { it.destinationDirectory }
        from new File(directory, 'psa-pc-resync.mixins.json')
        manifest.attributes('MixinConfigs': 'psa-pc-resync.mixins.json')
        preserveFileTimestamps = false; reproducibleFileOrder = true
    }
    project.reobf.create('psaPcResyncJar')
}
