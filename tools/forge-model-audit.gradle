// Test-only artifact using the pinned Forge build's mapped classpath.
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def sourceRoot = project.findProperty('psaModelAuditSource')
    if (!sourceRoot) throw new GradleException('psaModelAuditSource is required')
    def sourceDirectory = new File(sourceRoot.toString())
    if (!new File(sourceDirectory, 'NativeModelAudit.java').isFile()) throw new GradleException('Missing audit source')
    def compiler = project.tasks.register('compilePsaModelAudit', JavaCompile) {
        source new File(sourceDirectory, 'NativeModelAudit.java')
        classpath = project.sourceSets.main.compileClasspath
        destinationDirectory.set(project.layout.buildDirectory.dir('psa-model-audit/classes'))
        options.release.set(17)
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-proc:none']
    }
    project.tasks.register('psaModelAuditJar', Jar) {
        dependsOn compiler
        archiveFileName.set('psa-model-audit-0.1.jar')
        from compiler.flatMap { it.destinationDirectory }
        from new File(sourceDirectory, 'resources')
        manifest.attributes('FMLModType': 'MOD')
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    project.reobf.create('psaModelAuditJar')
}
