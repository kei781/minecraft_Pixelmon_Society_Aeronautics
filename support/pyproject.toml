[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psa-discord-support"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["discord.py>=2.5,<3", "openai>=2.0,<3", "pydantic>=2.10,<3"]

[project.scripts]
psa-support = "psa_support.cli:main"

[tool.setuptools.packages.find]
include = ["psa_support*"]
